name: Reality SNI candidates

# 实测 data/reality-sni-candidates.txt 里的每个域名（issue #62）。
# 只在名单、检查脚本或本文件改动时运行，不设定时任务；不是必需检查。

on:
  pull_request:
    paths:
      - data/reality-sni-candidates.txt
      - scripts/ci/reality-sni-check.sh
      - .github/workflows/reality-sni-candidates.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reality-sni-candidates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Reality SNI candidate check
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install check tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl iproute2 unzip dnsutils openssl
      - name: Build current ping-rust
        shell: bash
        run: cargo build --locked --release
      - name: Check candidates
        shell: bash
        env:
          PING_RUST: target/release/ping-rust
          CANDIDATES: data/reality-sni-candidates.txt
        run: bash scripts/ci/reality-sni-check.sh
      - name: Upload check records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reality-sni-check-records
          path: ${{ runner.temp }}/reality-sni-check/logs
          if-no-files-found: warn
