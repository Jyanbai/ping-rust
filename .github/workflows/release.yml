name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify tag is on main
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Verify tagged commit is on main
        shell: bash
        run: |
          set -euo pipefail
          tag_commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "${tag_commit}" refs/remotes/origin/main; then
            echo "error: tag ${GITHUB_REF_NAME} points to ${tag_commit}, which is not on main" >&2
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} -> ${tag_commit} is on main"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from scripts.ci.release_gate import verify_version
          verify_version(os.environ["GITHUB_REF_NAME"],
                         Path("Cargo.toml").read_text(),
                         Path("Cargo.lock").read_text())
          PY

  verify-required-checks:
    name: Verify all required checks for tag SHA
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Verify exact tag SHA CI E2E compatibility and security
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/release_gate.py checks --wait-seconds 4500

  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2
        with:
          tool: cross
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Build static binary
        run: cross build --locked --release --target "${{ matrix.target }}"

      - name: Install ARM64 runtime emulator
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static

      - name: Verify and package binary
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${TARGET}/release/ping-rust"
          test -x "${binary}"

          file "${binary}"
          if readelf -l "${binary}" | grep -q "Requesting program interpreter"; then
            echo "error: ${TARGET} binary contains a dynamic program interpreter" >&2
            exit 1
          fi
          if readelf -d "${binary}" 2>/dev/null | grep -q "(NEEDED)"; then
            echo "error: ${TARGET} binary contains dynamic library dependencies" >&2
            exit 1
          fi

          if [ "${TARGET}" = "aarch64-unknown-linux-musl" ]; then
            version_output="$(qemu-aarch64-static "${binary}" --version)"
            qemu-aarch64-static "${binary}" install-self --help >/dev/null
          else
            version_output="$("${binary}" --version)"
            "${binary}" install-self --help >/dev/null
          fi
          printf '%s\n' "${version_output}"
          printf '%s\n' "${version_output}" \
            | grep -Eq '^ping-rust [0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.-]+)?$'

          package_dir="dist/${TARGET}"
          mkdir -p "${package_dir}"
          install -m 0755 "${binary}" "${package_dir}/ping-rust"
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime='UTC 1970-01-01' -C "${package_dir}" -cf - ping-rust \
            | gzip -9n > "dist/ping-rust-${TARGET}.tar.gz"
          sha256sum "dist/ping-rust-${TARGET}.tar.gz"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ping-rust-${{ matrix.target }}
          path: dist/ping-rust-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify-tag, verify-required-checks, build]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          set -euo pipefail
          manifest_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "${manifest_version}" != "${tag_version}" ]; then
            echo "error: tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${manifest_version}" >&2
            exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Verify release assets and generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/release_gate.py artifacts --dist dist
          (cd dist && sha256sum --check --strict SHA256SUMS)

      - name: Recheck exact SHA immediately before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/release_gate.py checks --wait-seconds 0

      - name: Stage complete GitHub Release as private draft
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::error::Release ${GITHUB_REF_NAME} 已存在（包括 draft），禁止覆盖"
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --draft --verify-tag \
            --title "ping-rust ${GITHUB_REF_NAME}" \
            --generate-notes
          echo 'staged=true' >> "$GITHUB_OUTPUT"

      - name: Verify draft contains exactly the complete assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" --json isDraft,assets \
            | jq -e '.isDraft == true and
              ([.assets[].name] | sort) ==
              (["SHA256SUMS",
                "ping-rust-aarch64-unknown-linux-musl.tar.gz",
                "ping-rust-x86_64-unknown-linux-musl.tar.gz"] | sort)' >/dev/null

      - name: Publish validated draft
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "${GITHUB_REF_NAME}" --draft=false
          echo 'published=true' >> "$GITHUB_OUTPUT"

      - name: Verify public download integrity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-public"
          public="$RUNNER_TEMP/release-public"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          for asset in SHA256SUMS \
            ping-rust-x86_64-unknown-linux-musl.tar.gz \
            ping-rust-aarch64-unknown-linux-musl.tar.gz; do
            curl --fail --location --silent --show-error --retry 5 \
              --connect-timeout 15 --max-time 180 --proto '=https' --tlsv1.2 \
              "$base/$asset" -o "$public/$asset"
            cmp "dist/$asset" "$public/$asset"
          done
          (cd "$public" && sha256sum --check --strict SHA256SUMS)
      - name: Verify published one-click installer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/ping-rust-bin"
          bash scripts/install.sh \
            --version "${GITHUB_REF_NAME}" \
            --install-dir "${install_dir}" \
            --quiet \
            --no-bootstrap
          "${install_dir}/ping-rust" --version \
            | grep -Fx "ping-rust ${GITHUB_REF_NAME#v}"
          test -L "${install_dir}/prs"
          test "$(readlink "${install_dir}/prs")" = ping-rust
          test ! -e "${install_dir}/sb"
          "${install_dir}/prs" --version \
            | grep -Fx "ping-rust ${GITHUB_REF_NAME#v}"
          "${install_dir}/ping-rust" self-update \
            --version "${GITHUB_REF_NAME}" \
            --force
          "${install_dir}/ping-rust" --version \
            | grep -Fx "ping-rust ${GITHUB_REF_NAME#v}"

          conflict_dir="${RUNNER_TEMP}/ping-rust-conflict"
          mkdir -p "${conflict_dir}"
          printf 'owned-by-another-program\n' > "${conflict_dir}/prs"
          bash scripts/install.sh \
            --version "${GITHUB_REF_NAME}" \
            --install-dir "${conflict_dir}" \
            --quiet \
            --no-bootstrap
          grep -Fx 'owned-by-another-program' "${conflict_dir}/prs"
          test -x "${conflict_dir}/ping-rust"

          legacy_dir="${RUNNER_TEMP}/ping-rust-legacy-alias"
          mkdir -p "${legacy_dir}"
          ln -s ping-rust "${legacy_dir}/sb"
          bash scripts/install.sh \
            --version "${GITHUB_REF_NAME}" \
            --install-dir "${legacy_dir}" \
            --quiet \
            --no-bootstrap
          test ! -e "${legacy_dir}/sb"
          test "$(readlink "${legacy_dir}/prs")" = ping-rust

          bootstrap_dir="${RUNNER_TEMP}/ping-rust-bootstrap"
          bootstrap_output="${RUNNER_TEMP}/ping-rust-bootstrap-output.txt"
          mkdir -p "${bootstrap_dir}"
          sudo --preserve-env=GITHUB_TOKEN bash scripts/install.sh \
            --version "${GITHUB_REF_NAME}" \
            --install-dir "${bootstrap_dir}" \
            > "${bootstrap_output}"
          ! grep -Eq '选择协议|输入端口' "${bootstrap_output}"
          grep -q '首次安装：自动部署 VLESS-REALITY' "${bootstrap_output}"
          grep -q 'vless://' "${bootstrap_output}"
          bootstrap_uri="$(sudo "${bootstrap_dir}/ping-rust" url)"
          printf '%s' "${bootstrap_uri}" | grep -q '^vless://'
          sudo systemctl is-active --quiet shoes.service
          bootstrap_info="$(sudo "${bootstrap_dir}/ping-rust" info)"
          bootstrap_port="$(
            printf '%s' "${bootstrap_info}" \
              | sed -nE 's/.*0\.0\.0\.0:([0-9]+).*/\1/p' \
              | head -n 1
          )"
          test -n "${bootstrap_port}"
          sudo ss -H -lnt \
            | awk '{print $4}' \
            | grep -Eq "(^|:)${bootstrap_port}$"
          second_bootstrap="$(sudo "${bootstrap_dir}/ping-rust" bootstrap)"
          printf '%s' "${second_bootstrap}" \
            | grep -q '检测到已有 shoes 配置，跳过默认 VLESS-REALITY 部署。'
          rm -f "${bootstrap_output}"
          sudo "${bootstrap_dir}/ping-rust" uninstall --purge

      - name: Rollback public Release to draft on failure
        if: ${{ failure() && steps.publish.outputs.published == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Release 发布后公开下载或安装验收失败，尝试立即撤回为 draft"
          gh release edit "${GITHUB_REF_NAME}" --draft=true
