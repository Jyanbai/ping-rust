name: Codex Dispatch

# 仓库所有者在 issue / PR 下评论 `/codex <任务>`，把任务派给 Codex 云端去写代码。
#
#   PR 下评论    → Codex 在该 PR 的 head 分支上继续改，结果推到同一个 PR。
#   issue 下评论 → Codex 从 main 开始改，结果推到新分支并开新 PR（Closes #issue）。
#   手动触发     → workflow_dispatch，参数同上（prompt / pr / base）。
#   定时任务     → 每天跑一次轻量命令，让 Codex 按需刷新 token 并写回 secret。
#
# 流程：codex cloud exec → 轮询 codex cloud status → codex cloud diff
#       → 在 runner 上 git apply → commit → 用 CODEX_BOT_TOKEN 推送 / 开 PR。
#
# 凭据：ChatGPT 托管登录的 auth.json，存在 `codex` environment 的 CODEX_AUTH_JSON 里。
# Codex 刷新 token 后，本 workflow 把新的 auth.json 写回该 secret
# （OpenAI「Maintain Codex account auth in CI/CD (advanced)」里的 round-trip 模式）。
#
# 注意：OpenAI 的指南不建议在公开仓库这样用。这里的防护：
#   1. 只接受仓库所有者本人的评论 / 手动触发；
#   2. 持有凭据的 job 不执行仓库里的任何代码，只做 git apply / commit / push；
#   3. 凭据放在只允许 main 部署的 environment 里，PR 分支上的 workflow 拿不到；
#   4. CODEX_BOT_TOKEN 不给 Workflows 权限，且改动 .github/workflows 的 diff 会被拒绝；
#   5. 外部输入只经环境变量传给脚本，不做 ${{ }} 插值。
# 配置步骤见 docs/CODEX_DISPATCH.md。

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: 任务描述（留空 = 只做自检：Codex 登录、云端环境、凭据写回）
        required: false
        type: string
      pr:
        description: 要继续修改的 PR 编号（留空则新开 PR）
        required: false
        type: string
      base:
        description: 新开 PR 时的基准分支
        required: false
        default: main
        type: string
  schedule:
    # 每天一次。Codex 在 last_refresh 超过约 8 天时才会刷新 token，
    # 让刷新尽量发生在这个空闲任务里，减少和真实任务同时刷新的机会。
    - cron: '17 19 * * *'

permissions:
  contents: read

jobs:
  dispatch:
    if: >-
      github.event_name == 'schedule' || (
        github.actor == github.repository_owner && (
          github.event_name == 'workflow_dispatch' || (
            github.event_name == 'issue_comment' &&
            github.event.comment.user.login == github.repository_owner &&
            github.event.comment.author_association == 'OWNER' &&
            contains(github.event.comment.body, '/codex')
          )
        )
      )
    runs-on: ubuntu-latest
    environment: codex
    timeout-minutes: 100
    concurrency:
      # 同一个 issue / PR 的任务排队执行；不同 issue / PR 之间可以并行。
      group: codex-dispatch-${{ github.event.issue.number || inputs.pr || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      CODEX_CLI_VERSION: 0.166.0
      CODEX_ENV: ${{ vars.CODEX_ENV || 'ping-rust' }}
      POLL_MINUTES: ${{ vars.CODEX_POLL_MINUTES || '80' }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      NO_COLOR: '1'
    steps:
      - name: Parse request
        id: req
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          IN_PROMPT: ${{ inputs.prompt }}
          IN_PR: ${{ inputs.pr }}
          IN_BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          out="$GITHUB_OUTPUT"
          instr="$RUNNER_TEMP/instruction.txt"
          : > "$instr"

          case "$EVENT_NAME" in
            schedule)
              echo "mode=maintenance" >> "$out"
              exit 0
              ;;
            workflow_dispatch)
              if [ -z "${IN_PROMPT//[[:space:]]/}" ]; then
                echo "mode=maintenance" >> "$out"
                exit 0
              fi
              printf '%s\n' "$IN_PROMPT" > "$instr"
              if [ -n "$IN_PR" ]; then
                [[ "$IN_PR" =~ ^[0-9]+$ ]] || { echo "::error::pr 必须是数字"; exit 1; }
                { echo "mode=pr"; echo "number=$IN_PR"; } >> "$out"
              else
                { echo "mode=new"; echo "base=${IN_BASE:-main}"; } >> "$out"
              fi
              ;;
            issue_comment)
              body_file="$RUNNER_TEMP/comment.txt"
              jq -r '.comment.body' "$GITHUB_EVENT_PATH" | tr -d '\r' > "$body_file"
              # 取第一行以 `/codex` 开头的行（允许前缀 `[via Claude]`），
              # 该行剩余部分加上其后所有行就是任务内容；去掉末尾自动附加的
              # `---` + `_Generated by ..._` 署名块。
              awk '
                !found && match($0, /^[[:space:]]*([[]via Claude[]][[:space:]]*)?[/]codex([[:space:]]|$)/) {
                  found = 1
                  rest = substr($0, RSTART + RLENGTH)
                  sub(/^[[:space:]]+/, "", rest)
                  n = 1; buf[n] = rest
                  next
                }
                found { buf[++n] = $0 }
                END {
                  if (!found) exit 3
                  cut = n
                  for (i = n; i >= 1; i--) {
                    if (buf[i] ~ /^[[:space:]]*$/) continue
                    if (buf[i] ~ /^_Generated by /) {
                      for (j = i - 1; j >= 1 && buf[j] ~ /^[[:space:]]*$/; j--) {}
                      if (j >= 1 && buf[j] ~ /^---[[:space:]]*$/) cut = j - 1
                    }
                    break
                  }
                  while (cut >= 1 && buf[cut] ~ /^[[:space:]]*$/) cut--
                  for (i = 1; i <= cut; i++) print buf[i]
                }
              ' "$body_file" > "$instr" || {
                echo "评论里没有以 /codex 开头的行，跳过。"
                echo "mode=skip" >> "$out"
                exit 0
              }
              number="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
              comment_id="$(jq -r '.comment.id' "$GITHUB_EVENT_PATH")"
              comment_url="$(jq -r '.comment.html_url' "$GITHUB_EVENT_PATH")"
              if jq -e '.issue.pull_request' "$GITHUB_EVENT_PATH" >/dev/null; then
                echo "mode=pr" >> "$out"
              else
                { echo "mode=issue"; echo "base=main"; } >> "$out"
              fi
              {
                echo "number=$number"
                echo "comment_id=$comment_id"
                echo "comment_url=$comment_url"
              } >> "$out"
              ;;
            *)
              echo "::error::不支持的事件 $EVENT_NAME"
              exit 1
              ;;
          esac

          # 去掉首尾空行后，PR 模式必须有任务内容。
          sed -i -e '/./,$!d' "$instr"
          if [ ! -s "$instr" ] && grep -q '^mode=pr$' "$out"; then
            echo "::error::/codex 后面需要写上要做什么。"
            echo "empty=true" >> "$out"
          fi

      - name: Acknowledge comment
        if: steps.req.outputs.comment_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ steps.req.outputs.comment_id }}
        run: |
          gh api "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes >/dev/null || true

      - name: Reject empty request
        if: steps.req.outputs.empty == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.req.outputs.number }}
        run: |
          gh api "repos/$REPO/issues/$NUMBER/comments" \
            -f body="⚠️ \`/codex\` 后面需要写上要做什么，例如：\`/codex 把 README 里的安装命令改成 xxx\`" >/dev/null
          exit 1

      - name: Resolve target and build prompt
        id: target
        if: contains(fromJSON('["pr","issue","new"]'), steps.req.outputs.mode)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.req.outputs.mode }}
          NUMBER: ${{ steps.req.outputs.number }}
          BASE: ${{ steps.req.outputs.base }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          out="$GITHUB_OUTPUT"
          instr="$RUNNER_TEMP/instruction.txt"
          prompt="$RUNNER_TEMP/prompt.txt"
          rules=$'\n\n约束：\n- 不要修改 .github/workflows/ 和 .github/actions/ 下的任何文件（这类改动会被自动拒绝）。\n- 改动保持最小，只做任务要求的事；完成前运行与改动相关的测试，并在总结里写明跑了什么、结果如何。'

          case "$MODE" in
            pr)
              pr_json="$(gh api "repos/$REPO/pulls/$NUMBER")"
              state="$(jq -r '.state' <<<"$pr_json")"
              head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
              branch="$(jq -r '.head.ref' <<<"$pr_json")"
              title="$(jq -r '.title' <<<"$pr_json")"
              [ "$state" = "open" ] || { echo "::error::PR #$NUMBER 不是打开状态"; exit 1; }
              [ "$head_repo" = "$REPO" ] || { echo "::error::PR #$NUMBER 来自 fork，无法推送"; exit 1; }
              {
                # shellcheck disable=SC2016 # 反引号是给 Codex 看的 Markdown
                printf '你在 %s 仓库的分支 `%s` 上工作，它对应 PR #%s「%s」。\n' "$REPO" "$branch" "$NUMBER" "$title"
                printf '请在这个分支现有改动的基础上完成下面的要求：\n\n'
                cat "$instr"
                printf '%s\n' "$rules"
              } > "$prompt"
              {
                echo "task_branch=$branch"
                echo "checkout_ref=$branch"
                echo "push_branch=$branch"
                echo "report_number=$NUMBER"
              } >> "$out"
              ;;
            issue)
              issue_json="$(gh api "repos/$REPO/issues/$NUMBER")"
              title="$(jq -r '.title' <<<"$issue_json")"
              body="$(jq -r '.body // ""' <<<"$issue_json")"
              {
                printf '请在 %s 仓库里实现 issue #%s「%s」。\n\n' "$REPO" "$NUMBER" "$title"
                printf 'issue 内容：\n%s\n' "$body"
                if [ -s "$instr" ]; then
                  printf '\n补充要求：\n'
                  cat "$instr"
                fi
                printf '%s\n' "$rules"
              } > "$prompt"
              {
                echo "task_branch=$BASE"
                echo "checkout_ref=$BASE"
                echo "push_branch=codex/issue-$NUMBER-$RUN_ID"
                echo "report_number=$NUMBER"
                echo "open_pr=true"
              } >> "$out"
              ;;
            new)
              { cat "$instr"; printf '%s\n' "$rules"; } > "$prompt"
              {
                echo "task_branch=$BASE"
                echo "checkout_ref=$BASE"
                echo "push_branch=codex/task-$RUN_ID"
                echo "open_pr=true"
              } >> "$out"
              ;;
          esac

      - name: Install Codex CLI
        if: steps.req.outputs.mode != 'skip' && steps.req.outputs.empty != 'true'
        shell: bash
        run: npm install -g "@openai/codex@${CODEX_CLI_VERSION}" >/dev/null && codex --version

      - name: Restore Codex auth
        id: auth
        if: steps.req.outputs.mode != 'skip' && steps.req.outputs.empty != 'true'
        shell: bash
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          HAS_BOT_TOKEN: ${{ secrets.CODEX_BOT_TOKEN != '' }}
        run: |
          set -euo pipefail
          umask 077
          if [ "$HAS_BOT_TOKEN" != "true" ]; then
            echo "::error::environment codex 里没有 CODEX_BOT_TOKEN，请按 docs/CODEX_DISPATCH.md 配置"
            exit 1
          fi
          home="$RUNNER_TEMP/codex-home"
          mkdir -p "$home"
          export CODEX_HOME="$home"
          echo "CODEX_HOME=$home" >> "$GITHUB_ENV"
          if [ -z "$CODEX_AUTH_JSON" ]; then
            echo "::error::environment codex 里没有 CODEX_AUTH_JSON，请按 docs/CODEX_DISPATCH.md 配置"
            exit 1
          fi
          printf '%s' "$CODEX_AUTH_JSON" > "$home/auth.json"
          printf 'cli_auth_credentials_store = "file"\n' > "$home/config.toml"
          if ! jq -e '.auth_mode == "chatgpt" and ((.tokens.refresh_token // "") != "")' "$home/auth.json" >/dev/null; then
            echo "::error::CODEX_AUTH_JSON 不是有效的 ChatGPT 登录凭据，需要重新 seed（见 docs/CODEX_DISPATCH.md）"
            exit 1
          fi
          sha256sum "$home/auth.json" | cut -d' ' -f1 > "$RUNNER_TEMP/auth.seed.sha256"

          # codex cloud 查找云端环境时，先按当前目录 git remote 指向的仓库查（by-repo），
          # 再查全局列表；私有环境只在 by-repo 结果里。所以准备一个只有 remote、
          # 没有任何代码的空仓库，让所有 codex 命令都在这里运行。
          hint="$RUNNER_TEMP/codex-repo-hint"
          git init -q "$hint"
          git -C "$hint" remote add origin "https://github.com/$REPO.git"
          echo "CODEX_REPO_HINT=$hint" >> "$GITHUB_ENV"

          # 刷新后的新 token 不在原 secret 里，GitHub 不会自动遮蔽；每次调用 Codex 后都遮蔽一遍。
          cat > "$RUNNER_TEMP/codex-lib.sh" <<'LIB'
          codex() {
            (cd "$CODEX_REPO_HINT" && command codex "$@")
          }
          mask_tokens() {
            local t
            while IFS= read -r t; do
              if [ -n "$t" ]; then printf '::add-mask::%s\n' "$t"; fi
            done < <(jq -r '.tokens // {} | .[] | strings' "$CODEX_HOME/auth.json" 2>/dev/null || true)
            return 0
          }
          LIB
          # shellcheck source=/dev/null
          . "$RUNNER_TEMP/codex-lib.sh"
          mask_tokens
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Self-check (auth, cloud environment, write-back)
        if: steps.req.outputs.mode == 'maintenance'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CODEX_BOT_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . "$RUNNER_TEMP/codex-lib.sh"
          # 顺带让 Codex 按需刷新 token；--env 也会校验 CODEX_ENV 是否存在。
          if ! codex cloud list --env "$CODEX_ENV" --limit 1 >/dev/null; then
            mask_tokens
            echo "::group::诊断信息"
            # 只打印不敏感的字段：套餐类型，以及 codex 写在 error.log 里的请求状态码。
            payload="$(jq -r '.tokens.id_token // ""' "$CODEX_HOME/auth.json" | cut -d. -f2 | tr '_-' '/+')"
            while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
            plan="$(base64 -d <<<"$payload" 2>/dev/null \
              | jq -r '."https://api.openai.com/auth".chatgpt_plan_type // empty' 2>/dev/null || true)"
            echo "登录账号的套餐类型：${plan:-未知}"
            grep -hE '\] (startup|env):' "$CODEX_REPO_HINT/error.log" 2>/dev/null || echo "（没有 error.log）"
            echo "::endgroup::"
            echo "::error::Codex 找不到云端环境「$CODEX_ENV」。检查：环境是否已发布（Save and publish）、CLI 登录的是否是建环境的那个账号 / 工作区。"
            exit 1
          fi
          mask_tokens
          echo "✅ Codex 登录有效，云端环境「$CODEX_ENV」可用。"
          # 每次都真写一次 environment secret，确认 CODEX_BOT_TOKEN 有写回权限且没过期，
          # 不要等到 token 真的刷新时才发现写不回去。
          if ! date -u +%FT%TZ | gh secret set CODEX_WRITEBACK_CHECK --env codex --repo "$REPO"; then
            echo "::error::CODEX_BOT_TOKEN 无法写 environment secret（权限不足或已过期），刷新后的凭据将无法保存。"
            exit 1
          fi
          echo "✅ CODEX_BOT_TOKEN 可以写回 environment secret。"

      - name: Submit Codex cloud task
        id: submit
        if: steps.target.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_BRANCH: ${{ steps.target.outputs.task_branch }}
          REPORT_NUMBER: ${{ steps.target.outputs.report_number }}
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . "$RUNNER_TEMP/codex-lib.sh"
          url="$(codex cloud exec --env "$CODEX_ENV" --branch "$TASK_BRANCH" - < "$RUNNER_TEMP/prompt.txt" | tail -n 1)"
          mask_tokens
          [[ "$url" =~ ^https://[^[:space:]]+/tasks/[A-Za-z0-9_-]+$ ]] || { echo "::error::没拿到任务链接：$url"; exit 1; }
          echo "task_url=$url" >> "$GITHUB_OUTPUT"
          echo "Codex 任务：$url" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$REPORT_NUMBER" ]; then
            body="🤖 已派给 Codex 云端（分支 \`$TASK_BRANCH\`）：$url"$'\n\n'"完成后会在这里更新结果。[运行日志]($RUN_URL)"
            id="$(gh api "repos/$REPO/issues/$REPORT_NUMBER/comments" -f body="$body" --jq .id)"
            echo "status_comment_id=$id" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for Codex
        id: wait
        if: steps.submit.outcome == 'success'
        shell: bash
        env:
          TASK_URL: ${{ steps.submit.outputs.task_url }}
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . "$RUNNER_TEMP/codex-lib.sh"
          deadline=$((SECONDS + POLL_MINUTES * 60))
          unknown=0
          while :; do
            raw="$(codex cloud status "$TASK_URL" 2>&1 || true)"
            mask_tokens
            first="$(printf '%s\n' "$raw" | sed 's/\x1b\[[0-9;]*m//g' | head -n 1)"
            status="$(printf '%s\n' "$first" | sed -n 's/^\[\([A-Z]*\)\].*/\1/p')"
            case "$status" in
              READY|APPLIED)
                title="$(printf '%s\n' "$first" | sed 's/^\[[A-Z]*\] *//')"
                printf 'title=%s\n' "$title" >> "$GITHUB_OUTPUT"
                echo "Codex 完成：$first"
                break
                ;;
              ERROR)
                echo "::error::Codex 任务失败：$first"
                exit 1
                ;;
              PENDING)
                unknown=0
                ;;
              *)
                unknown=$((unknown + 1))
                echo "::warning::无法解析状态（第 $unknown 次）：$first"
                [ "$unknown" -lt 6 ] || { echo "::error::连续无法获取任务状态"; exit 1; }
                ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::等了 $POLL_MINUTES 分钟 Codex 还没完成；任务仍在云端运行，可稍后手动处理：$TASK_URL"
              exit 1
            fi
            sleep 30
          done

      - name: Fetch diff
        id: diff
        if: steps.wait.outcome == 'success'
        shell: bash
        env:
          TASK_URL: ${{ steps.submit.outputs.task_url }}
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . "$RUNNER_TEMP/codex-lib.sh"
          patch="$RUNNER_TEMP/task.patch"
          codex cloud diff "$TASK_URL" > "$patch"
          mask_tokens
          if [ ! -s "$patch" ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qE '^(diff --git a/|--- a/|\+\+\+ b/|rename (from|to) |copy (from|to) )\.github/(workflows|actions)/' "$patch"; then
            echo "::error::Codex 的改动涉及 .github/workflows/ 或 .github/actions/，已拒绝。"
            echo "forbidden=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "empty=false" >> "$GITHUB_OUTPUT"

      - name: Checkout target branch
        if: steps.diff.outputs.empty == 'false'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ steps.target.outputs.checkout_ref }}
          token: ${{ secrets.CODEX_BOT_TOKEN }}
          path: work
          fetch-depth: 0

      - name: Apply, commit and push
        id: push
        if: steps.diff.outputs.empty == 'false'
        shell: bash
        working-directory: work
        env:
          GH_TOKEN: ${{ secrets.CODEX_BOT_TOKEN }}
          TASK_URL: ${{ steps.submit.outputs.task_url }}
          TASK_TITLE: ${{ steps.wait.outputs.title }}
          PUSH_BRANCH: ${{ steps.target.outputs.push_branch }}
          CHECKOUT_REF: ${{ steps.target.outputs.checkout_ref }}
          OPEN_PR: ${{ steps.target.outputs.open_pr }}
          MODE: ${{ steps.req.outputs.mode }}
          NUMBER: ${{ steps.req.outputs.number }}
          COMMENT_URL: ${{ steps.req.outputs.comment_url }}
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/task.patch"
          git config user.name "codex-dispatch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$PUSH_BRANCH" != "$CHECKOUT_REF" ]; then
            git switch -c "$PUSH_BRANCH"
          fi
          git apply --index "$patch" || git apply --index --3way "$patch"
          if git diff --cached --quiet; then
            echo "nothing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          stat="$(git diff --cached --shortstat | sed 's/^ *//')"
          title="${TASK_TITLE:-Codex task}"
          title="${title:0:72}"
          msg="$RUNNER_TEMP/commit-msg.txt"
          {
            printf '%s\n\n' "$title"
            printf 'Codex-Task: %s\n' "$TASK_URL"
            [ -z "$COMMENT_URL" ] || printf 'Requested-In: %s\n' "$COMMENT_URL"
          } > "$msg"
          git commit -q -F "$msg"
          git push -q origin "HEAD:refs/heads/$PUSH_BRANCH"
          sha="$(git rev-parse --short HEAD)"
          {
            echo "sha=$sha"
            echo "stat=$stat"
          } >> "$GITHUB_OUTPUT"

          if [ "$OPEN_PR" = "true" ]; then
            body="$RUNNER_TEMP/pr-body.txt"
            {
              [ "$MODE" != "issue" ] || printf 'Closes #%s\n\n' "$NUMBER"
              printf '由 Codex 云端生成：%s\n' "$TASK_URL"
              [ -z "$COMMENT_URL" ] || printf '\n触发评论：%s\n' "$COMMENT_URL"
              printf '\n改动：%s\n' "$stat"
            } > "$body"
            pr_url="$(gh pr create --repo "$REPO" --base "$CHECKOUT_REF" --head "$PUSH_BRANCH" \
              --title "$title" --body-file "$body")"
            echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          fi

      - name: Report result
        if: always() && steps.submit.outputs.status_comment_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ steps.submit.outputs.status_comment_id }}
          TASK_URL: ${{ steps.submit.outputs.task_url }}
          EMPTY: ${{ steps.diff.outputs.empty }}
          FORBIDDEN: ${{ steps.diff.outputs.forbidden }}
          NOTHING: ${{ steps.push.outputs.nothing }}
          SHA: ${{ steps.push.outputs.sha }}
          STAT: ${{ steps.push.outputs.stat }}
          PR_URL: ${{ steps.push.outputs.pr_url }}
          PUSH_BRANCH: ${{ steps.target.outputs.push_branch }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ -n "$PR_URL" ]; then
            result="✅ 已开 PR：$PR_URL（$STAT）"
          elif [ -n "$SHA" ]; then
            result="✅ 已推送 \`$SHA\` 到 \`$PUSH_BRANCH\`（$STAT）"
          elif [ "$EMPTY" = "true" ] || [ "$NOTHING" = "true" ]; then
            result="ℹ️ Codex 完成了，但没有产生代码改动。"
          elif [ "$FORBIDDEN" = "true" ]; then
            result="⛔ Codex 的改动涉及 \`.github/workflows/\` 或 \`.github/actions/\`，已拒绝推送。"
          else
            result="❌ 失败（$JOB_STATUS），详见运行日志。"
          fi
          body="🤖 Codex 任务：$TASK_URL"$'\n\n'"$result"$'\n\n'"[运行日志]($RUN_URL)"
          gh api -X PATCH "repos/$REPO/issues/comments/$COMMENT_ID" -f body="$body" >/dev/null

      - name: Persist refreshed auth
        if: always() && steps.auth.outputs.ok == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CODEX_BOT_TOKEN }}
        run: |
          set -euo pipefail
          file="$CODEX_HOME/auth.json"
          # 只有 Codex 真的刷新过（文件变了）才写回，避免并行任务用旧文件覆盖新 token。
          new_sha="$(sha256sum "$file" | cut -d' ' -f1)"
          if [ "$new_sha" = "$(cat "$RUNNER_TEMP/auth.seed.sha256")" ]; then
            echo "auth.json 未变化，无需写回。"
            exit 0
          fi
          if ! jq -e '.auth_mode == "chatgpt" and ((.tokens.refresh_token // "") != "")' "$file" >/dev/null; then
            echo "::error::刷新后的 auth.json 不完整，未写回；下次运行可能需要重新 seed。"
            exit 1
          fi
          gh secret set CODEX_AUTH_JSON --env codex --repo "$REPO" < "$file"
          echo "已把刷新后的 auth.json 写回 environment codex。"

      - name: Remove local credentials
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/codex-home" "$RUNNER_TEMP/codex-lib.sh" "$RUNNER_TEMP/codex-repo-hint"
