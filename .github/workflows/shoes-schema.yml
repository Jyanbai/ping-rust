name: shoes schema compatibility

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "scripts/ci/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/shoes-schema.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "scripts/ci/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/shoes-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SHOES_COMMIT: 386b11532424b8665ee3e46340c6236fb3c47595
  SHOES_VERSION: 0.2.8

jobs:
  dry-run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Build fixed shoes revision
        shell: bash
        run: |
          set -euo pipefail
          runtime_pin="$(sed -n 's/^const SHOES_SCHEMA_REVISION: &str = "\([0-9a-f]*\)";$/\1/p' src/installer.rs)"
          test "$runtime_pin" = "$SHOES_COMMIT"
          shoes_source="$RUNNER_TEMP/shoes-source"
          shoes_target="$RUNNER_TEMP/shoes-target"
          git init "$shoes_source"
          git -C "$shoes_source" remote add origin https://github.com/cfal/shoes.git
          git -C "$shoes_source" fetch --depth 1 origin "$SHOES_COMMIT"
          git -C "$shoes_source" checkout --detach FETCH_HEAD
          test "$(git -C "$shoes_source" rev-parse HEAD)" = "$SHOES_COMMIT"
          CARGO_TARGET_DIR="$shoes_target" cargo build \
            --locked --release --manifest-path "$shoes_source/Cargo.toml"
          sudo install -m 0755 "$shoes_target/release/shoes" /usr/local/bin/shoes
          shoes_version="$(shoes --version)"
          printf '%s\n' "$shoes_version"
          grep -F "$SHOES_VERSION" <<<"$shoes_version"
      - name: Build ping-rust
        run: cargo build --locked
      - name: Validate complete shoes compatibility matrix
        env:
          PING_RUST_SHOES_E2E_BIN: /usr/local/bin/shoes
        run: bash scripts/ci/validate-shoes-schema.sh
