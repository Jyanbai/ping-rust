name: PR merge gate regression

on:
  push:
    paths:
      - scripts/ci/pr_merge_gate*
      - scripts/ci/test_pr_merge_gate.py
      - .github/workflows/pr-merge-gate*.yml
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Check PR merge gate regression
        run: python3 -m unittest discover -s scripts/ci -p test_pr_merge_gate.py -v
