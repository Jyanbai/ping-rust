name: TMP codex sandbox experiment

# 临时实验（不会合并）：从本分支的 codex-dispatch.yml 原样抽出 "Restore Codex auth" 和
# "Verify sandbox hides credentials" 两个步骤，用假凭据在 runner 上运行（不调用模型、不用 secret），
# 并做两组反例：打开网络、去掉 deny 行，检查必须失败。

on:
  push:
    branches: [claude/eager-stonebraker-c7ce22]
    paths: ['.github/workflows/tmp-codex-sandbox-experiment.yml', '.github/workflows/codex-dispatch.yml']

permissions:
  contents: read

jobs:
  verify-step:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          path: work
          persist-credentials: false

      - name: Extract steps from codex-dispatch.yml
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/steps"
          for name in "Restore Codex auth" "Verify sandbox hides credentials"; do
            python3 -c 'import sys; sys.path.insert(0, "work/scripts/ci"); import test_codex_dispatch_prompt as t; print(t.step_script(sys.argv[1]), end="")' \
              "$name" > "$GITHUB_WORKSPACE/steps/${name// /-}.sh"
          done
          ls -la "$GITHUB_WORKSPACE/steps"
          version="$(sed -nE 's/^  CODEX_CLI_VERSION: ([0-9.]+)$/\1/p' work/.github/workflows/codex-dispatch.yml)"
          test -n "$version"
          echo "CODEX_CLI_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install Codex CLI (same version as codex-dispatch.yml)
        shell: bash
        run: npm install -g "@openai/codex@${CODEX_CLI_VERSION}" >/dev/null && codex --version

      - name: Run "Restore Codex auth" with fake credentials
        shell: bash
        env:
          CODEX_AUTH_JSON: '{"auth_mode":"chatgpt","tokens":{"refresh_token":"fake-refresh-token-for-sandbox-probe"}}'
          HAS_BOT_TOKEN: 'true'
        run: bash -e -o pipefail "$GITHUB_WORKSPACE/steps/Restore-Codex-auth.sh"

      - name: Run "Verify sandbox hides credentials" (must pass)
        shell: bash
        run: |
          set -euo pipefail
          cat "$CODEX_HOME/config.toml"
          out="$(mktemp)"
          GITHUB_OUTPUT="$out" bash -e -o pipefail "$GITHUB_WORKSPACE/steps/Verify-sandbox-hides-credentials.sh"
          grep -qx 'ok=true' "$out"
          echo "PASS: verify step succeeded with the real ci profile"

      - name: Negative — network enabled (must fail)
        shell: bash
        run: |
          set -u -o pipefail; set +e
          cfg="$CODEX_HOME/config.toml"
          cp "$cfg" "$cfg.bak"
          sed -i 's/^enabled = false$/enabled = true/' "$cfg"
          grep -q '^enabled = true$' "$cfg" || exit 1
          log="$(mktemp)"
          GITHUB_OUTPUT=/dev/null bash -e -o pipefail "$GITHUB_WORKSPACE/steps/Verify-sandbox-hides-credentials.sh" > "$log" 2>&1
          rc=$?
          cat "$log"
          mv "$cfg.bak" "$cfg"
          [ "$rc" -ne 0 ] || { echo "FAIL: verify step passed with network enabled"; exit 1; }
          grep -q '沙箱里能访问外网（域名）' "$log" || { echo "FAIL: missing domain message"; exit 1; }
          grep -q '沙箱里能访问外网（直连 IP）' "$log" || { echo "FAIL: missing direct IP message"; exit 1; }
          echo "PASS: verify step rejects network-enabled profile (exit $rc)"

      - name: Negative — RUNNER_TEMP deny removed (must fail)
        shell: bash
        run: |
          set -u -o pipefail; set +e
          cfg="$CODEX_HOME/config.toml"
          cp "$cfg" "$cfg.bak"
          sed -i '/" = "deny"$/d' "$cfg"
          if grep -q '"deny"' "$cfg"; then exit 1; fi
          log="$(mktemp)"
          GITHUB_OUTPUT=/dev/null bash -e -o pipefail "$GITHUB_WORKSPACE/steps/Verify-sandbox-hides-credentials.sh" > "$log" 2>&1
          rc=$?
          cat "$log"
          mv "$cfg.bak" "$cfg"
          [ "$rc" -ne 0 ] || { echo "FAIL: verify step passed without deny"; exit 1; }
          grep -q '凭据文件可读' "$log" || { echo "FAIL: missing credential message"; exit 1; }
          echo "PASS: verify step rejects profile without RUNNER_TEMP deny (exit $rc)"

      - name: Loopback inside the real ci profile (evidence for (b))
        shell: bash
        run: |
          set -u -o pipefail; set +e
          # shellcheck disable=SC2016
          codex sandbox -P ci -C "$GITHUB_WORKSPACE" -- python3 -I -c '
          import socket
          for fam, host in ((socket.AF_INET, "127.0.0.1"), (socket.AF_INET6, "::1")):
              try:
                  s = socket.socket(fam, socket.SOCK_STREAM); s.bind((host, 0)); s.listen(1)
                  print(host, "bind OK")
              except OSError as exc:
                  print(host, "->", type(exc).__name__, exc)
          '
          echo "codex sandbox exit: $?"
