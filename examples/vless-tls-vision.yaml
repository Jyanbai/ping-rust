# 示例凭据均为假值；证书路径由部署环境提供。
- address: 0.0.0.0:443
  protocol:
    type: tls
    tls_targets:
      vless.example.com:
        cert: /etc/shoes/server.pem
        key: /etc/shoes/server-key.pem
        alpn_protocols: [h2, http/1.1]
        vision: true
        protocol:
          type: vless
          user_id: b85798ef-e9dc-46a4-9a87-8da4499d36d0
          udp_enabled: true
